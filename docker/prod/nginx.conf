# Agency OS - nginx de producción (sin privilegios: puerto 8080, pid y temporales en /tmp).
# TLS lo termina el proxy de Coolify (Traefik); acá solo HTTP.
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;

# 1 worker alcanza para este tráfico (backoffice interno) y ahorra RAM.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    log_format main '$http_x_forwarded_for - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Subidas de PDF de hasta 25 MB (PHP: upload_max_filesize 25M, post_max_size 30M).
    client_max_body_size 30M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;

    # Brotli dinámico liviano (HTML/JSON de Inertia) + estático (public/build precomprimido en el Dockerfile).
    brotli on;
    brotli_comp_level 4;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/javascript application/javascript application/json
                 application/xml image/svg+xml font/ttf font/otf;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_errors off;

    # Upgrade de WebSocket (Reverb)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Assets de Vite con hash en el nombre: cacheables para siempre.
        location /build/ {
            access_log off;
            gzip_static on;
            brotli_static on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Reverb (WebSockets) detrás del mismo dominio: wss://<dominio>/app/<APP_KEY>
        # y la API de publicación /apps/<APP_ID>/events. El proceso Reverb escucha en 127.0.0.1:8081.
        location /app/ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_pass http://127.0.0.1:8081;
        }

        location /apps/ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_pass http://127.0.0.1:8081;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Solo index.php se ejecuta; cualquier otro .php es 404.
        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 120s;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ \.php$ {
            return 404;
        }

        # Dotfiles fuera de alcance (excepto /.well-known)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
