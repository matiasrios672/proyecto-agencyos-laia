; Agency OS - PHP de producción (se carga como zz-agency.ini, después de los defaults de la imagen)

; --- General ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 256M
max_execution_time = 60
date.timezone = America/Argentina/Buenos_Aires
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Subidas (PDF de hasta 25 MB). Coherente con client_max_body_size 30M de nginx ---
; post_max_size > upload_max_filesize para cubrir el overhead multipart y los demás campos del formulario.
file_uploads = On
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20

; --- Sesiones: las maneja Laravel (Redis); estas son solo defensas ---
session.cookie_httponly = 1
session.use_strict_mode = 1

; --- Opcache de producción ---
; validate_timestamps=0: el código es inmutable dentro de la imagen; se recarga con cada deploy.
opcache.enable = 1
opcache.enable_cli = 0
; Tamaño ajustado a una app Laravel mediana (vendor + app ~ 6-8k archivos): 96 MB sobran.
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 12
opcache.max_accelerated_files = 12000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; JIT tracing con buffer chico: ayuda en código CPU-bound (PDF, cálculos de finanzas) y cuesta ~32 MB.
; Para ahorrar RAM o ante inestabilidad: opcache.jit = disable y opcache.jit_buffer_size = 0.
opcache.jit = tracing
opcache.jit_buffer_size = 32M

; Preload: NO se activa. Con Laravel el beneficio es marginal y un preload mal armado rompe el arranque
; de php-fpm; con validate_timestamps=0 el opcache ya sirve todo desde memoria.
