; Agency OS - PHP-FPM (reemplaza zz-docker.conf de la imagen oficial).
; Escucha solo en loopback: nginx corre en el mismo contenedor.
[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000

; ondemand: sin workers ociosos (ahorra RAM en VPS chico); se crean al llegar tráfico y se liberan a los 20s.
; Tope de 6 hijos x ~60-80 MB reales = ~400 MB en el peor caso. Subilo si el VPS tiene más RAM.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 20s
pm.max_requests = 400

; Imprescindible: sin esto PHP-FPM borra las variables de entorno inyectadas por Coolify.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 120s
