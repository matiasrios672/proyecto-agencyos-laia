; Agency OS - Supervisor (corre como usuario "app", sin root).
; Los programas opcionales se activan con variables de entorno (el entrypoint les da un valor por defecto):
;   RUN_QUEUE / RUN_SCHEDULER / RUN_REVERB = true|false     QUEUE_WORKERS = cantidad de workers
; Todo el log va a stdout/stderr del contenedor (se ve en la pestaña Logs de Coolify).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -e /dev/stderr -c /etc/nginx/nginx.conf -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Cola: --max-time/--max-jobs reciclan el worker (evita fugas de memoria); --timeout < stopwaitsecs.
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --backoff=10 --timeout=90 --max-time=3600 --max-jobs=500 --memory=128
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
priority=30
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=100
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler: debe correr en UNA sola réplica (RUN_SCHEDULER=false en las demás).
[program:scheduler]
command=php /var/www/html/artisan schedule:work
priority=30
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Reverb (WebSockets): escucha en REVERB_SERVER_HOST:REVERB_SERVER_PORT (0.0.0.0:8081, interno); nginx lo publica en /app y /apps.
[program:reverb]
command=php /var/www/html/artisan reverb:start
priority=30
autostart=%(ENV_RUN_REVERB)s
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
