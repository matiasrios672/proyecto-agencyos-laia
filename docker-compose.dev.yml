name: laia-agencyos

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile.dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: laia-agencyos-app:dev
  volumes:
    - .:/var/www/html
  # Sin env_file: Laravel lee el .env montado. Pasarlo como variables reales del proceso
  # pisaría los valores de phpunit.xml y los tests correrían contra la base de desarrollo.
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    container_name: laia-app

  nginx:
    image: nginx:1.27-alpine
    container_name: laia-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: laia-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laia}
      POSTGRES_USER: ${DB_USERNAME:-laia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laia} -d ${DB_DATABASE:-laia}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: laia-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  reverb:
    <<: *app
    container_name: laia-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8081 --debug
    ports:
      - "${REVERB_FORWARD_PORT:-8081}:8081"

  worker:
    <<: *app
    container_name: laia-worker
    command: sh -c "php artisan queue:work --tries=3 --timeout=90 & php artisan schedule:work"

  # Bandeja de correo de desarrollo: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: laia-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  node:
    image: node:22-alpine
    container_name: laia-node
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
    profiles: ["frontend"]

  playwright:
    image: node:22-bookworm
    container_name: laia-playwright
    working_dir: /var/www/html
    environment:
      BASE_URL: http://localhost:8080
      PLAYWRIGHT_BROWSERS_PATH: /pw-browsers
    command: sh -c "npx playwright install --with-deps chromium && node tests/e2e/audit.mjs"
    volumes:
      - .:/var/www/html
      - pwbrowsers:/pw-browsers
    depends_on:
      - nginx
    profiles: ["qa"]

volumes:
  pgdata:
  redisdata:
  pwbrowsers:
